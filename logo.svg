<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24" />
      <stop offset="100%" stop-color="#0e1017" />
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#7c4dff" />
      <stop offset="100%" stop-color="#00e676" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c4b5fd" />
    </linearGradient>
    <linearGradient id="accentTrackerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c4dff" />
      <stop offset="100%" stop-color="#00e676" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Icon Container -->
  <g transform="translate(6, 6)">
    <!-- Squircle Background -->
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#logoBgGrad)" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" />
    <rect x="3" y="3" width="46" height="46" rx="11" fill="none" stroke="url(#logoGrad)" stroke-width="1" opacity="0.4" />

    <!-- Crest Graphics -->
    <g transform="translate(26,26)">
      <!-- Slash Left -->
      <path d="M-15,-12 C-8,-20 6,-18 15,-10 C8,-8 -3,-6 -10,2 C-13,6 -14,12 -15,15 C-16,8 -17,-3 -15,-12 Z" 
            fill="url(#logoGrad)" filter="url(#logoGlow)" opacity="0.9" />
      <!-- Play Blade Right -->
      <path d="M-6,-13 L15,0 L-6,13 L-1,0 Z" fill="#ffffff" />
      <path d="M-3,-8 L11,0 L-3,8 L0,0 Z" fill="url(#logoGrad)" />
      <!-- Star Sparkle -->
      <path d="M10,-13 Q13,-13 13,-16 Q13,-13 16,-13 Q13,-13 13,-10 Q13,-13 10,-13 Z" fill="#00e676" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(70, 24)">
    <!-- Primary Title "ANIME" -->
    <text x="0" y="8" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="-0.02em" fill="url(#textGrad)">
      ANIME
    </text>
    <!-- Accent Title "TRACKER" -->
    <text x="73" y="8" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="-0.02em" fill="url(#accentTrackerGrad)">
      TRACKER
    </text>
    <!-- Subtitle Pill -->
    <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="0.16em" fill="#8b92a5" text-transform="uppercase">
      PRO RADAR &amp; STREAM
    </text>
  </g>
</svg>
